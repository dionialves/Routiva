services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: routiva:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container traffic uses the service name and internal port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      COLLECTOR_ADDRESS: unix:///run/routiva/collector.sock
      INDICATORS_LOG_PATH: /var/log/routiva/indicators.log
    ports:
      - '${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080'
    volumes:
      - collector_socket:/run/routiva
      - indicator_logs:/var/log/routiva
    depends_on:
      collector:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    environment:
      COLLECTOR_LOG_PATH: /var/log/routiva/collector.log
      COLLECTOR_LOG_MAX_MIB: ${COLLECTOR_LOG_MAX_MIB:-100}
      COLLECTOR_LOG_FILES: ${COLLECTOR_LOG_FILES:-10}
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ping_group_range: '10001 10001'
    volumes:
      - collector_socket:/run/routiva
      - collector_logs:/var/log/routiva
    stop_grace_period: 15s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scriptping}
      POSTGRES_USER: ${POSTGRES_USER:-scriptping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  collector_socket:
  collector_logs:
  indicator_logs:
  postgres_data:
