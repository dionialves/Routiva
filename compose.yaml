services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: routiva:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container traffic uses the service name and internal port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      COLLECTOR_ADDRESS: unix:///run/routiva/collector.sock
      INDICATORS_AGGREGATION_PAGE_SIZE: ${INDICATORS_AGGREGATION_PAGE_SIZE:-10000}
      INDICATORS_AGGREGATION_INTERVAL_MS: ${INDICATORS_AGGREGATION_INTERVAL_MS:-60000}
      AP_SSH_KNOWN_HOSTS_FILE: /var/lib/routiva/ap-known-hosts
      AP_SECRETS_KEY_FILE: /var/lib/routiva/ap-secrets.key
      MIMOSA_KNOWN_CERTIFICATES_DIRECTORY: /var/lib/routiva/mimosa-certificates
      BACKUP_TFTP_HOST: ${BACKUP_TFTP_HOST:-}
      BACKUP_TFTP_INBOX: /mnt/tftp-inbox
      INDICATORS_LOG_PATH: /var/log/routiva/indicators.log
    ports:
      - '${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080'
    volumes:
      - collector_socket:/run/routiva
      - indicator_logs:/var/log/routiva
      - app_data:/var/lib/routiva
      - "${BACKUP_TFTP_DIRECTORY:-backup_tftp_inbox}:/mnt/tftp-inbox:nocopy"
    depends_on:
      collector:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    environment:
      COLLECTOR_SPOOL_PATH: /var/lib/routiva/queue.db
      COLLECTOR_SPOOL_MAX_MIB: ${COLLECTOR_SPOOL_MAX_MIB:-256}
      COLLECTOR_SPOOL_MAX_AGE_HOURS: ${COLLECTOR_SPOOL_MAX_AGE_HOURS:-24}
      COLLECTOR_BATCH_SIZE: ${COLLECTOR_BATCH_SIZE:-500}
      COLLECTOR_FLUSH_MS: ${COLLECTOR_FLUSH_MS:-100}
      COLLECTOR_RESULT_BUFFER: ${COLLECTOR_RESULT_BUFFER:-32768}
      COLLECTOR_LOG_PATH: /var/log/routiva/collector.log
      COLLECTOR_LOG_MAX_MIB: ${COLLECTOR_LOG_MAX_MIB:-100}
      COLLECTOR_LOG_FILES: ${COLLECTOR_LOG_FILES:-10}
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ping_group_range: '10001 10001'
    volumes:
      - collector_socket:/run/routiva
      - collector_logs:/var/log/routiva
      - collector_data:/var/lib/routiva
    stop_grace_period: 15s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scriptping}
      POSTGRES_USER: ${POSTGRES_USER:-scriptping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  tftp:
    build: ./deploy/tftp
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_BIND_SERVICE, SYS_CHROOT, SETGID, SETUID]
    command:
      - --foreground
      - --pidfile
      - /run/tftpd.pid
      - --ipv4
      - --address
      - "${BACKUP_TFTP_BIND_HOST:-${BACKUP_TFTP_HOST:-127.0.0.1}}:69"
      - --port-range
      - "40000:40015"
      - --user
      - routiva
      - --secure
      - --create
      - --umask
      - "077"
      - --map-file
      - /etc/tftp-upload-only.rules
      - /srv/tftp
    volumes:
      - "${BACKUP_TFTP_DIRECTORY:-backup_tftp_inbox}:/srv/tftp"
volumes:
  backup_tftp_inbox:
  app_data:
  collector_socket:
  collector_logs:
  collector_data:
  indicator_logs:
  postgres_data:
