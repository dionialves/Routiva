# ============================================================
# ANÁLISE DE PERDA DE PACOTES — ajuste rápido das regras
# Percentuais REAIS sempre são exibidos. Não existe corte visual.
# A coleta usa monitor.interval-ms (padrão 1000 ms, em application.yml).
# ============================================================
# Janelas móveis, em segundos.
monitor.loss.minute-window-seconds=60
monitor.loss.hour-window-seconds=3600

# Minuto: limites equivalentes numa referência de 60 pacotes.
# 0 = NORMAL; abaixo de 2 = EVENTO_ISOLADO; 2 = ATENCAO;
# de 3 até abaixo de 6 = DEGRADADO; 6 ou mais = CRITICO.
# O cálculo é proporcional à quantidade REAL de pings da janela.
monitor.loss.minute-reference-packets=60
monitor.loss.minute-attention-losses=2
monitor.loss.minute-degraded-losses=3
monitor.loss.minute-critical-losses=6

# Hora: comparações sem arredondamento prévio.
# Até 0.05% NORMAL; acima de 0.05% ATENCAO;
# a partir de 0.1% DEGRADADO; a partir de 0.5% CRITICO.
monitor.loss.hour-normal-max-percent=0.05
monitor.loss.hour-degraded-min-percent=0.1
monitor.loss.hour-critical-min-percent=0.5

# Cor crítica imediata por perdas consecutivas CONFIRMADAS.
monitor.loss.consecutive-critical=3

# Recorrência: 2 dos últimos 3 minutos completos com >= 2 perdas
# equivalentes por minuto. Os períodos são avaliados após fechar.
monitor.loss.recurrence-bucket-seconds=60
monitor.loss.recurrence-buckets=3
monitor.loss.recurrence-required-buckets=2
monitor.loss.recurrence-bucket-losses=2

# Recuperar a indicação operacional após 5 minutos de respostas
# contínuas, sem perdas, erros internos nem lacunas de coleta.
monitor.loss.recovery-seconds=300

# Confiança da classificação e saúde do coletor.
monitor.loss.minimum-coverage-ratio=0.8
monitor.loss.minimum-samples=2
monitor.loss.max-gap-multiplier=3
monitor.loss.cache-millis=1000

# PROVISÓRIO: retenção até a implementação da política definitiva.
monitor.retention-hours=${PING_RETENTION_HOURS:48}
monitor.cleanup-interval-seconds=${PING_CLEANUP_INTERVAL_SECONDS:600}

# Limite global de latência para novas amostras, em milissegundos.
monitor.latency-limit-ms=${PING_LATENCY_LIMIT_MS:20}
