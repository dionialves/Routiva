# ============================================================
# ANÁLISE DE PERDA DE PACOTES — ajuste rápido das regras
# Percentuais REAIS sempre são exibidos. Não existe corte visual.
# A coleta usa monitor.interval-ms (padrão 1000 ms, em application.yml).
# ============================================================
# Janelas móveis, em segundos.
monitor.loss.minute-window-seconds=60
monitor.loss.hour-window-seconds=3600

# Classificação percentual nas janelas de 5 minutos, 1 hora e 8 horas.
# Até 0.33% (inclusive): NORMAL; acima de 0.33% e abaixo de 1%: ATENCAO;
# a partir de 1% (inclusive): CRITICO. Comparação sem arredondamento.
monitor.loss.hour-normal-max-percent=0.33
monitor.loss.hour-critical-min-percent=1.0

# Confiança da classificação e saúde do coletor.
monitor.loss.minimum-coverage-ratio=0.8
monitor.loss.minimum-samples=2
monitor.loss.max-gap-multiplier=3

# PROVISÓRIO: retenção até a implementação da política definitiva.
monitor.retention-hours=${PING_RETENTION_HOURS:48}
monitor.cleanup-interval-seconds=${PING_CLEANUP_INTERVAL_SECONDS:600}

# Limite global de latência para novas amostras, em milissegundos.
monitor.latency-limit-ms=${PING_LATENCY_LIMIT_MS:20}

# Coletor Go independente. TCP remoto exige mTLS.
collector.address=${COLLECTOR_ADDRESS:unix:///run/routiva/collector.sock}
collector.executable=${COLLECTOR_EXECUTABLE:}
collector.tls-ca=${COLLECTOR_TLS_CA:}
collector.tls-cert=${COLLECTOR_TLS_CERT:}
collector.tls-key=${COLLECTOR_TLS_KEY:}

# Indicator cycle audit file. Timestamps and messages use UTC and English.
indicators.log.path=${INDICATORS_LOG_PATH:logs/indicators.log}
indicators.log.max-file-size=${INDICATORS_LOG_MAX_FILE_SIZE:10MB}
indicators.log.max-history=${INDICATORS_LOG_MAX_HISTORY:7}
indicators.log.total-size-cap=${INDICATORS_LOG_TOTAL_SIZE_CAP:100MB}
