# ============================================================
# ANÁLISE DE PERDA DE PACOTES — ajuste rápido das regras
# Percentuais REAIS sempre são exibidos. Não existe corte visual.
# A coleta usa monitor.interval-ms (padrão 1000 ms, em application.yml).
# ============================================================
# Janelas móveis, em segundos.
monitor.loss.minute-window-seconds=60
monitor.loss.hour-window-seconds=3600

# Classificação percentual nas janelas de 5 minutos, 1 hora e 8 horas.
# Até 0.33% (inclusive): NORMAL; acima de 0.33% e abaixo de 1%: ATENCAO;
# a partir de 1% (inclusive): CRITICO. Comparação sem arredondamento.
monitor.loss.hour-normal-max-percent=0.33
monitor.loss.hour-critical-min-percent=1.0

# Confiança da classificação e saúde do coletor.
monitor.loss.minimum-coverage-ratio=0.8
monitor.loss.minimum-samples=2
monitor.loss.max-gap-multiplier=3

# PROVISÓRIO: retenção até a implementação da política definitiva.
monitor.keep-raw=${PING_KEEP_RAW:no}
monitor.raw-retention-minutes=${PING_RAW_RETENTION_MINUTES:2880}
monitor.cleanup-enabled=${PING_CLEANUP_ENABLED:true}
monitor.cleanup-batch-size=${PING_CLEANUP_BATCH_SIZE:1000}

# Limite global de latência para novas amostras, em milissegundos.
monitor.latency-limit-ms=${PING_LATENCY_LIMIT_MS:20}

# Coletor Go independente. TCP remoto exige mTLS.
collector.address=${COLLECTOR_ADDRESS:unix:///run/routiva/collector.sock}
collector.executable=${COLLECTOR_EXECUTABLE:}
# Bounded delivery window and raw persistence groups; aggregation remains every 60s.
collector.send-window=${COLLECTOR_SEND_WINDOW:16}
collector.persistence-max-results=${COLLECTOR_PERSISTENCE_MAX_RESULTS:5000}
collector.persistence-wait-ms=${COLLECTOR_PERSISTENCE_WAIT_MS:100}
collector.tls-ca=${COLLECTOR_TLS_CA:}
collector.tls-cert=${COLLECTOR_TLS_CERT:}
collector.tls-key=${COLLECTOR_TLS_KEY:}

# Indicator cycle audit file. Timestamps and messages use UTC and English.
indicators.log.path=${INDICATORS_LOG_PATH:logs/indicators.log}
indicators.log.max-file-size=${INDICATORS_LOG_MAX_FILE_SIZE:10MB}
indicators.log.max-history=${INDICATORS_LOG_MAX_HISTORY:7}
indicators.log.total-size-cap=${INDICATORS_LOG_TOTAL_SIZE_CAP:100MB}

# Persist SQL minute aggregates every minute; drain backlog in bounded transactions.
indicators.aggregation.interval-ms=${INDICATORS_AGGREGATION_INTERVAL_MS:60000}
indicators.aggregation.page-size=${INDICATORS_AGGREGATION_PAGE_SIZE:10000}

# Independent availability publisher: delay after completion prevents catch-up storms.
indicators.availability.interval-ms=${INDICATORS_AVAILABILITY_INTERVAL_MS:60000}
indicators.availability.initial-delay-ms=${INDICATORS_AVAILABILITY_INITIAL_DELAY_MS:0}

# Batch summary writes across hosts.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Session-only wireless quality, updated by the existing live Registration Table query.
wireless.quality.window=${WIRELESS_QUALITY_WINDOW:30}
wireless.quality.retention-ms=${WIRELESS_QUALITY_RETENTION_MS:120000}
wireless.quality.signal=${WIRELESS_QUALITY_SIGNAL:-71,-75,-83}
wireless.quality.snr=${WIRELESS_QUALITY_SNR:30,25,15}
wireless.quality.ccq=${WIRELESS_QUALITY_CCQ:90,80,60}
wireless.quality.idle-bps=${WIRELESS_QUALITY_IDLE_BPS:100000}
wireless.quality.significant-bps=${WIRELESS_QUALITY_SIGNIFICANT_BPS:1000000}
wireless.quality.history-ms=${WIRELESS_QUALITY_HISTORY_MS:60000}
wireless.quality.confirmations=${WIRELESS_QUALITY_CONFIRMATIONS:2}
wireless.quality.strong-signal=${WIRELESS_QUALITY_STRONG_SIGNAL:-50}
wireless.quality.hysteresis=${WIRELESS_QUALITY_HYSTERESIS:1,1,2}
