<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head>
<link th:fragment="base" rel="stylesheet" href="/style.css?v=20261115-ui-pagination">
<link th:fragment="actions" rel="stylesheet" href="/buttons.css?v=20261115-ds1">
<link th:fragment="filters" rel="stylesheet" href="/query-filters.css?v=20261115-ds1">
<link th:fragment="layout" rel="stylesheet" href="/page-layout.css?v=20261115-ds1">
<link th:fragment="dialogStyles" rel="stylesheet" href="/form-dialog.css?v=20261115-ds1">
<link th:fragment="picker" rel="stylesheet" href="/multi-picker.css?v=20261115-ds1">
<link th:fragment="analysisDialogStyles" rel="stylesheet" href="/analysis-dialog.css?v=20261116-header">
</head><body>
<article th:fragment="indicator(title, valueId, description, descriptionId)" class="card">
  <h2 th:text="${title}"></h2>
  <strong th:id="${valueId}">—</strong>
  <p th:attr="id=${descriptionId}" th:text="${description}"></p>
</article>
<select th:fragment="period(controlId, fieldName, selectedMinutes)" th:id="${controlId}" th:attr="name=${fieldName}">
  <option th:each="choice : ${T(br.com.scriptping.availability.AvailabilityPeriod).OPTIONS}"
          th:value="${choice.minutes()}" th:text="${choice.label()}"
          th:selected="${choice.minutes() == selectedMinutes}"></option>
</select>
<dialog th:fragment="formDialog(dialogId, titleId, descriptionId, content)"
        class="settings-panel form-dialog" th:id="${dialogId}" th:attr="aria-labelledby=${titleId},aria-describedby=${descriptionId}">
  <th:block th:replace="${content}"></th:block>
</dialog>
<dialog th:fragment="analysisDialog(dialogId, titleId, descriptionId, content)" class="settings-panel form-dialog analysis-dialog" th:id="${dialogId}" th:attr="aria-labelledby=${titleId},aria-describedby=${descriptionId}">
  <th:block th:replace="${content}"></th:block>
</dialog>
<div th:fragment="dataTable(label, sections)" class="table-scroll" role="region" th:attr="aria-label=${label}" tabindex="0">
  <table class="hosts-table"><th:block th:replace="${sections}"></th:block></table>
</div>
<button th:fragment="action(buttonId, iconName, label)" type="button" class="system-button" th:id="${buttonId}">
  <svg th:replace="~{shell :: icon(${iconName})}"></svg><span th:text="${label}"></span>
</button>
</body></html>
