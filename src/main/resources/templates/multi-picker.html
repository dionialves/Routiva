<div xmlns:th="http://www.thymeleaf.org" th:fragment="groups" class="incident-picker-field incident-group-field"><span id="incident-group-label">Grupo de hosts</span><select name="groupId" id="incident-group" multiple hidden aria-hidden="true"><option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.name}"></option></select><details id="incident-group-picker" class="incident-picker"><summary aria-labelledby="incident-group-label incident-group-summary"><span id="incident-group-summary">Todos os grupos</span><svg th:replace="~{shell :: icon('chevron-down')}"></svg></summary><div class="incident-picker-panel"><label><span class="sr-only">Pesquisar grupo de hosts</span><input type="search" id="incident-group-search" placeholder="Pesquisar grupo de hosts" autocomplete="off"></label><div id="incident-group-options" class="incident-picker-options" role="group" aria-label="Grupos de hosts"></div><p id="incident-group-empty" hidden>Nenhum grupo encontrado.</p></div></details></div>
