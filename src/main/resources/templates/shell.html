<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="security">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
<meta name="is-admin" th:content="${isAdmin}">
<script src="/security.js?v=1" defer></script>
</th:block>
<svg th:fragment="icon(name)" class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use th:href="${'/icons.svg#' + name}"></use></svg>
<aside th:fragment="sidebar(active)" class="sidebar" id="sidebar" aria-label="Menu principal">
<div class="sidebar-identity"><a class="brand" href="/disponibilidade" aria-label="TraceOne Network — Disponibilidade"><svg class="brand-logo" viewBox="1190 245 880 245" role="img" aria-label="TraceOne"><image href="/traceone-brand.png?v=2" width="2172" height="724"/></svg><span class="brand-product">NETWORK</span></a><button class="icon-button sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Recolher menu" title="Recolher menu" aria-expanded="true" aria-controls="sidebar"><svg th:replace="~{shell :: icon('panel-left')}"></svg></button><button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Fechar menu"><svg th:replace="~{shell :: icon('close')}"></svg></button></div>
<nav class="side-nav" aria-label="Páginas de monitoramento">
<a href="/disponibilidade" title="Disponibilidade" th:classappend="${active == 'availability'} ? 'active'" th:attr="aria-current=${active == 'availability'} ? 'page' : null"><svg th:replace="~{shell :: icon('activity')}"></svg><span>Disponibilidade</span></a>
<a href="/incidentes" title="Incidentes" th:classappend="${active == 'incidents'} ? 'active'" th:attr="aria-current=${active == 'incidents'} ? 'page' : null"><svg th:replace="~{shell :: icon('alert')}"></svg><span>Incidentes</span></a>
<a href="/diagnostico/grupos" title="Grupo de Hosts" th:classappend="${active == 'diagnostics'} ? 'active'" th:attr="aria-current=${active == 'diagnostics'} ? 'page' : null"><svg th:replace="~{shell :: icon('activity')}"></svg><span>Grupo de Hosts</span></a>
<a href="/ap" title="Access Point" th:classappend="${active == 'ap'} ? 'active'" th:attr="aria-current=${active == 'ap'} ? 'page' : null"><svg th:replace="~{shell :: icon('wifi')}"></svg><span>Access Point</span></a>
<a href="/mapas" title="Mapas" th:classappend="${active == 'maps'} ? 'active'" th:attr="aria-current=${active == 'maps'} ? 'page' : null"><svg th:replace="~{shell :: icon('map')}"></svg><span>Mapas</span></a>
<div class="sidebar-group" data-sidebar-group="settings" th:if="${isAdmin}"><button type="button" class="sidebar-group-toggle" aria-controls="settings-submenu" th:attr="aria-expanded=${active == 'settings' or active == 'users'}" title="Configuração"><svg th:replace="~{shell :: icon('settings')}"></svg><span>Configuração</span><svg class="ui-icon nav-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#chevron-right"></use></svg></button><div id="settings-submenu" class="sidebar-submenu" th:hidden="${active != 'settings' and active != 'users'}"><a href="/configuracao/zabbix" title="Integração Zabbix" th:classappend="${active == 'settings'} ? 'active'" th:attr="aria-current=${active == 'settings'} ? 'page' : null"><span>Integração Zabbix</span></a><a href="/configuracao/usuarios" title="Usuários" th:classappend="${active == 'users'} ? 'active'" th:attr="aria-current=${active == 'users'} ? 'page' : null"><span>Usuários</span></a></div></div>
</nav>
<div class="sidebar-footer"><details class="utility-menu sidebar-help"><summary title="Ajuda e suporte" aria-label="Ajuda e suporte"><svg th:replace="~{shell :: icon('help')}"></svg><span>Ajuda e suporte</span></summary><div class="utility-panel"><strong>TraceOne Network</strong><p>Consulte os indicadores em Disponibilidade, organize os Mapas de rede e gerencie os equipamentos em Configuração → Integração Zabbix.</p></div></details></div>
</aside>
<header th:fragment="topbar" class="topbar"><button class="icon-button mobile-nav-toggle" id="mobile-nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><svg th:replace="~{shell :: icon('menu')}"></svg></button><div class="topbar-actions"><span class="profile-name" th:text="${currentUserName}"></span><details class="utility-menu profile-menu"><summary class="profile-avatar" aria-label="Opções do perfil" title="Opções do perfil"><svg th:replace="~{shell :: icon('user')}"></svg></summary><div class="utility-panel profile-panel"><form th:action="@{/logout}" method="post"><button type="submit" class="system-button">Sair</button></form></div></details></div></header></body></html>
