<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso • TraceOne</title><link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/buttons.css?v=20261112-zabbix-standard"><link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page"><main class="auth-card">
  <svg class="auth-brand" viewBox="1190 245 880 245" role="img" aria-label="TraceOne Network"><image href="/traceone-brand.png?v=2" width="2172" height="724"/></svg>
  <p class="eyebrow">ACESSO AO SISTEMA</p><h1>Informe sua senha</h1>
  <p>Entrando como <strong th:text="${username}"></strong>.</p>
  <form th:action="@{/login/senha}" method="post" class="auth-form">
    <input type="text" name="username" th:value="${username}" autocomplete="username" hidden>
    <label>Senha<input name="password" type="password" required maxlength="128" autocomplete="current-password" autofocus></label>
    <p th:if="${error}" class="auth-error" role="alert" th:text="${error}"></p>
    <button class="system-button system-button-primary" type="submit">Entrar</button>
    <a href="/login">Usar outro usuário</a>
  </form>
</main></body></html>
