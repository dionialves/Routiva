<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <th:block th:replace="~{shell :: security}"></th:block>
  <title>Hosts • TraceOne</title><link rel="icon" href="/favicon.svg">
  <th:block th:replace="~{design-system :: base}"></th:block><link rel="stylesheet" href="/availability.css">
  <th:block th:replace="~{design-system :: filters}"></th:block>
  <th:block th:replace="~{design-system :: layout}"></th:block>
  <th:block th:replace="~{design-system :: actions}"></th:block>
  <th:block th:replace="~{design-system :: dialogStyles}"></th:block>
  <th:block th:replace="~{design-system :: analysisDialogStyles}"></th:block>
  <th:block th:replace="~{design-system :: picker}"></th:block>
  <link rel="stylesheet" href="/hosts.css?v=20261126-backup-name-width">
  <script src="/shell.js?v=20261124-dialog-notifications" defer></script>
  <script src="/multi-picker.js" defer></script><script src="/hosts.js?v=20261126-unified-save" defer></script>
</head>
<body class="availability-dashboard">
<aside th:replace="~{shell :: sidebar('hosts')}"></aside>
<div class="app-workspace"><header th:replace="~{shell :: topbar}"></header>
<main class="page-content availability-page hosts-page">
  <div class="availability-heading page-action-heading"><div><p class="eyebrow">CONFIGURAÇÃO</p><h1>Hosts</h1><p>Cadastre e edite hosts com as alterações salvas no Zabbix.</p></div>
    <div class="settings-actions"><button id="host-sync" type="button" class="system-button"><svg th:replace="~{shell :: icon('refresh')}"></svg>Sincronizar</button><button id="host-new" type="button" class="system-button system-button-primary query-primary-action" aria-haspopup="dialog" aria-controls="host-dialog" disabled><svg th:replace="~{shell :: icon('plus')}"></svg>Novo host</button></div>
  </div>
  <section class="card query-filter-bar" aria-label="Filtros de hosts"><div class="query-filter-row">
    <div th:replace="~{multi-picker :: checklist('filter-group', 'Grupo de hosts', 'server', 'Todos os grupos', 'Pesquisar grupo de hosts')}"></div>
    <div th:replace="~{multi-picker :: checklist('filter-host', 'Hosts', 'server', 'Todos os hosts', 'Pesquisar host')}"></div>
    <label class="query-filter-field"><span class="query-filter-label"><svg th:replace="~{shell :: icon('network')}"></svg>Conexão</span><select id="host-filter-connection"><option value="" selected>Todas as conexões</option><option value="NOT_CONFIGURED">Não configurado</option><option value="ACTIVE">Ativa</option><option value="ERROR">Erro</option></select></label>
    <label class="query-filter-field"><span class="query-filter-label"><svg th:replace="~{shell :: icon('search')}"></svg>IP</span><input id="host-search" type="search" placeholder="Pesquisar endereço IP…" autocomplete="off"></label>
  </div></section>
  <section class="card availability-host-section" aria-labelledby="hosts-title"><h2 id="hosts-title">Hosts</h2>
    <p id="hosts-state" role="status" aria-live="polite">Carregando hosts…</p>
    <div th:replace="~{design-system :: dataTable('Hosts cadastrados', ~{hosts :: listSections})}"><th:block th:fragment="listSections"><thead><tr><th scope="col" aria-sort="ascending"><button type="button" data-host-sort="name">Nome <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="items">Itens <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="triggers">Trigger <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="interface">Interface <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="templates">Templates <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="status">Status <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="connection">Conexão <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="backup">Backup <span aria-hidden="true">↕</span></button></th><th scope="col" aria-sort="none"><button type="button" data-host-sort="availability">Disponibilidade <span aria-hidden="true">↕</span></button></th></tr></thead><tbody id="hosts-rows"></tbody></th:block></div>
    <nav class="system-pagination" aria-label="Paginação de hosts"><button id="hosts-prev" type="button" class="system-button" disabled>Anterior</button><span id="hosts-range"></span><button id="hosts-next" type="button" class="system-button" disabled>Próxima</button></nav>
  </section>
</main></div>
<th:block th:replace="~{host-dialog :: dialogs}"></th:block>
</body></html>
