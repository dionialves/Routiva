<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{shell :: security}"></th:block>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Point • TraceOne</title>
  <link rel="icon" href="/favicon.svg"><th:block th:replace="~{design-system :: base}"></th:block>
  <link rel="stylesheet" href="/availability.css?v=20261127-table-states"><th:block th:replace="~{design-system :: picker}"></th:block><link rel="stylesheet" href="/access-points.css?v=20261127-table-states">

  <link rel="stylesheet" href="/host-menu.css?v=20261117-host-actions"><script src="/host-menu.js?v=20261124-terminal-access" defer></script>
  <script src="/shell.js?v=20261124-dialog-notifications" defer></script><script src="/multi-picker.js?v=20261112-standard" defer></script><script src="/access-points.js?v=20261127-table-states" defer></script>
<th:block th:replace="~{design-system :: filters}"></th:block><th:block th:replace="~{design-system :: layout}"></th:block><th:block th:replace="~{design-system :: actions}"></th:block><th:block th:replace="~{host-dialog :: resources}"></th:block></head>
<body class="availability-dashboard">
<aside th:replace="~{shell :: sidebar('ap')}"></aside>
<div class="app-workspace"><header th:replace="~{shell :: topbar}"></header>
<main class="page-content availability-page ap-page">
  <div class="availability-heading page-action-heading"><div class="ap-heading-copy"><div><p class="eyebrow">REDE WIRELESS</p><h1>Access Point</h1><p>Analise seus APs e os clientes conectados à rede wireless outdoor.</p></div></div><button id="ap-import" th:hidden="${!isAdmin}" class="system-button system-button-primary ap-primary query-primary-action" aria-haspopup="dialog" aria-controls="ap-dialog"><span data-ap-icon="upload"></span>Importar</button></div>
  <section class="card ap-filter-card query-filter-bar" aria-label="Filtros de Access Points" data-clear-filters="false">
    <div class="ap-filters query-filter-row">
      <div th:replace="~{multi-picker :: groups}"></div>
      <div class="incident-picker-field incident-host-field query-filter-field"><span id="incident-host-label"><span class="query-filter-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>Hosts</span></span><select name="hostId" id="incident-host" multiple hidden aria-hidden="true"></select><details id="incident-host-picker" class="incident-picker"><summary aria-labelledby="incident-host-label incident-host-summary"><span id="incident-host-summary">Todos os hosts</span><svg th:replace="~{shell :: icon('chevron-down')}"></svg></summary><div class="incident-picker-panel"><label><span class="sr-only">Pesquisar host</span><input type="search" id="incident-host-search" placeholder="Pesquisar host ou IP" autocomplete="off"></label><div id="incident-host-options" class="incident-picker-options" role="group" aria-label="Hosts"></div><p id="incident-host-empty" hidden>Nenhum host encontrado.</p></div></details></div>

    </div>
  </section>
  <section class="card availability-host-section" aria-labelledby="ap-title">
    <div th:replace="~{design-system :: tableHeading('ap-title', 'Access Points cadastrados', 'radio-tower', 'ap-rows')}"></div>

    <button id="ap-retry" hidden class="system-button"><svg class="system-button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg>Tentar novamente</button>
    <div th:replace="~{design-system :: dataTable('Access Points cadastrados', ~{access-points :: listSections})}"><th:block th:fragment="listSections"><thead><tr><th scope="col" aria-sort="none"><button type="button" id="ap-sort-name">Nome<span data-ap-icon="arrow-up-down"></span></button></th><th scope="col" aria-sort="none"><button type="button" id="ap-sort-ip">IP<span data-ap-icon="arrow-up-down"></span></button></th><th scope="col" aria-sort="none"><button type="button" id="ap-sort-manufacturer">Fabricante / Modelo<span data-ap-icon="arrow-up-down"></span></button></th><th scope="col" aria-sort="none"><button type="button" id="ap-sort-connectedClients">Clientes conectados<span data-ap-icon="arrow-up-down"></span></button></th><th scope="col" aria-sort="none"><button type="button" id="ap-sort-lastCollectedAt">Última leitura<span data-ap-icon="arrow-up-down"></span></button></th></tr></thead><tbody id="ap-rows"></tbody></th:block></div>
    <nav th:replace="~{design-system :: tablePagination('Paginação dos Access Points', 'ap-pagination', 'APs', 'ap-rows', null)}"></nav>
  </section>
</main></div>
<dialog th:replace="~{design-system :: formDialog('ap-dialog', 'ap-dialog-title', 'ap-dialog-description', ~{access-points :: ap-dialog-modal-content})}"><th:block th:fragment="ap-dialog-modal-content">
  <header th:replace="~{design-system :: modalHeader('ap-dialog-title', 'Importar Access Points', 'ap-dialog-description', 'Selecione os hosts que conectam clientes wireless outdoor. APs já definidos não aparecem nesta lista.', 'radio-tower', 'ap-close', 'Fechar importação')}"></header>
  <div class="form-dialog-content ap-import-body">
    <div class="ap-transfer">
      <section aria-labelledby="ap-available-title"><h3 id="ap-available-title">Hosts disponíveis <span id="ap-available-count">(0)</span></h3><label class="ap-import-search"><span data-ap-icon="search"></span><input type="search" id="ap-available-search" placeholder="Buscar por nome ou IP" aria-label="Buscar por nome ou IP" autocomplete="off"></label><div class="ap-host-list" id="ap-available" role="group" aria-label="Hosts disponíveis"></div></section>
      <div class="ap-arrows"><button id="ap-select" type="button" aria-label="Adicionar hosts selecionados" title="Adicionar hosts selecionados" disabled class="ap-transfer-arrow"><span data-ap-icon="arrow-right"></span></button><button id="ap-remove" type="button" aria-label="Retirar hosts selecionados" title="Retirar hosts selecionados" disabled class="ap-transfer-arrow"><span data-ap-icon="arrow-left"></span></button></div>
      <section aria-labelledby="ap-selected-title"><h3 id="ap-selected-title">Hosts selecionados <span id="ap-selected-count">(0)</span></h3><label class="ap-import-search"><span data-ap-icon="search"></span><input type="search" id="ap-selected-search" placeholder="Buscar na seleção" aria-label="Buscar na seleção" autocomplete="off"></label><div class="ap-host-list" id="ap-selected" role="group" aria-label="Hosts selecionados"></div></section>
    </div>
  </div>
  <footer th:replace="~{design-system :: modalFooter(~{access-points :: importDialogFooter})}"></footer>
</th:block></dialog>
<th:block th:fragment="importDialogFooter"><div class="ap-import-feedback"><span id="ap-import-status-icon" data-ap-icon="info"></span><p id="ap-import-state" role="status" aria-live="polite">Marque os hosts e use → para selecionar ou ← para retirar.</p></div><div class="settings-actions"><button id="ap-cancel" type="button" class="system-button"><svg th:replace="~{shell :: icon('close')}"></svg>Cancelar</button><button id="ap-save" type="button" class="system-button system-button-primary" disabled><svg th:replace="~{shell :: icon('download')}"></svg><span id="ap-save-label">Definir como AP</span></button></div></th:block>
<th:block th:replace="~{host-dialog :: dialogs}"></th:block></body></html>
