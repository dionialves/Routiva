<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' • ScriptPing'">ScriptPing</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/webjars/htmx.org/2.0.4/dist/htmx.min.js" defer></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
<header>
  <div><p class="eyebrow">MONITORAMENTO DE REDE</p><h1>Script<span>Ping</span></h1><p>Todos os hosts. Cada milissegundo.</p></div>
  <div class="refresh-controls">
    <div class="refresh-interval"><label for="refresh-interval">Atualização automática</label>
      <select id="refresh-interval" aria-label="Intervalo de atualização automática">
        <option value="5" selected>5 segundos</option>
        <option value="10">10 segundos</option>
        <option value="15">15 segundos</option>
        <option value="60">60 segundos</option>
      </select>
    </div>
    <button id="refresh-now" type="button">Atualizar agora</button>
  </div>
</header>
<main>
  <nav class="page-nav" aria-label="Páginas de monitoramento">
    <a href="/hosts" th:classappend="${!groupPage} ? 'active'" th:attr="aria-current=${!groupPage} ? 'page' : null">Hosts</a>
    <a href="/grupos" th:classappend="${groupPage} ? 'active'" th:attr="aria-current=${groupPage} ? 'page' : null">Grupos de hosts</a>
  </nav>
  <form id="filters" class="filters" method="get" th:action="${pagePath}"
        th:attr="hx-get=${pagePath}" hx-target="#dashboard" hx-swap="innerHTML"
        hx-trigger="submit, input changed delay:300ms from:input, change from:select"
        hx-sync="#dashboard:replace" hx-replace-url="true">
    <input id="page-number" type="hidden" name="page" th:value="${currentPage}">
    <input id="sort-column" type="hidden" name="sort" th:value="${sort}">
    <input id="sort-direction" type="hidden" name="direction" th:value="${direction}">
    <div class="search-filter"><label for="search">Pesquisar por nome</label><input id="search" type="search" name="q" th:value="${q}" placeholder="Digite o nome…" autocomplete="off"></div>
    <div><label for="ping-status">Status de ping</label><select id="ping-status" name="pingStatus">
      <option value="all" th:selected="${pingStatus == 'all'}">Todos os status</option>
      <option value="green" th:selected="${pingStatus == 'green'}">Verde · abaixo de 15 ms</option>
      <option value="yellow" th:selected="${pingStatus == 'yellow'}">Amarelo · 15 a 20 ms</option>
      <option value="red" th:selected="${pingStatus == 'red'}">Vermelho · latência, perdas ou indisponibilidade</option>
      <option value="gray" th:selected="${pingStatus == 'gray'}" th:text="${groupPage} ? 'Cinza · sem hosts elegíveis' : 'Cinza · sem IP válido ou incidente reconhecido'"></option>
      <option value="neutral" th:selected="${pingStatus == 'neutral'}">Neutro · aguardando dados</option>
      <optgroup label="Situação">
        <option value="normal" th:selected="${pingStatus == 'normal'}">Normal</option>
        <option value="high-latency" th:selected="${pingStatus == 'high-latency'}">Latência alta (com ou sem perdas)</option>
        <option value="packet-loss" th:selected="${pingStatus == 'packet-loss'}">Com perda de pacotes (com ou sem latência alta)</option>
        <option value="latency-and-loss" th:selected="${pingStatus == 'latency-and-loss'}">Com latência e perda de pacotes</option>
      </optgroup>
    </select></div>
    <div th:if="${!groupPage}"><label for="host-group">Grupo de hosts</label>
      <select id="host-group" name="groupId">
        <option value="" th:selected="${groupId.isEmpty()}">Todos os grupos</option>
        <option th:if="${groupUnavailable}" th:value="${groupId}" selected>Grupo indisponível</option>
        <option th:each="group : ${groupOptions}" th:value="${group.id}" th:text="${group.name}" th:selected="${group.id == groupId}"></option>
      </select>
    </div>
    <button type="submit">Pesquisar</button>
    <a class="clear-filters" th:href="${pagePath}">Limpar filtros</a>
  </form>
  <div class="legend"><span>● Menos de 15 ms</span><span>● 15 a 20 ms</span><span>● Acima de 20 ms / perdas / indisponível</span><span>● Sem IP válido</span></div>
  <section id="dashboard" th:attr="hx-get=${pagePath}" hx-include="#filters"
           hx-trigger="refresh" hx-swap="innerHTML" hx-sync="this:replace" aria-label="Resultados do monitoramento">
    <th:block th:replace="~{dashboard :: content}"/>
  </section>
  <p id="connection" role="status"></p>
</main>

</body>
</html>
