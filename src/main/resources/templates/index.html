<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScriptPing • Monitor de rede</title><link rel="stylesheet" href="/style.css"><script src="/webjars/htmx.org/2.0.4/dist/htmx.min.js" defer></script></head><body><header><div><p class="eyebrow">MONITORAMENTO DE REDE</p><h1>Script<span>Ping</span></h1><p>Todos os hosts. Cada milissegundo.</p></div><div class="live">● Atualização automática · 2s</div></header><main><div class="legend"><span>● Menos de 15 ms</span><span>● 15 a 20 ms</span><span>● Acima de 20 ms / indisponível</span></div><section id="dashboard" hx-get="/dashboard" hx-trigger="every 2s" hx-swap="innerHTML" hx-sync="this:drop"><th:block th:replace="~{dashboard :: content}"/></section><p id="connection" role="status"></p></main><script>document.body.addEventListener('htmx:sendError',()=>document.getElementById('connection').textContent='Conexão com o painel interrompida. Tentando novamente…');document.body.addEventListener('htmx:afterRequest',e=>{document.getElementById('connection').textContent=e.detail.successful?'':'Falha ao atualizar o painel. Tentando novamente…';});</script></body></html>
