<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' • TraceOne'">TraceOne</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/webjars/htmx.org/2.0.4/dist/htmx.min.js" defer></script>
    <script src="/dashboard.js" defer></script>
    <script src="/shell.js" defer></script>
  </head>
  <body>
    <aside th:replace="~{shell :: sidebar(${groupPage} ? 'groups' : 'hosts')}"></aside>
    <div class="app-workspace">
    <header th:replace="~{shell :: topbar}"></header>
    <main class="page-content">
      <div class="page-heading"><div><p class="eyebrow">NETWORK</p><h1 th:text="${groupPage} ? 'Grupo de host' : 'Hosts'"></h1><p th:text="${groupPage} ? 'Visão geral dos grupos da sua infraestrutura' : 'Visão geral dos hosts da sua infraestrutura'"></p></div>
      <div class="refresh-controls">
        <div class="refresh-interval">
          <select id="refresh-interval" aria-label="Intervalo de atualização automática">
            <option value="5" selected>5 segundos</option>
            <option value="10">10 segundos</option>
            <option value="15">15 segundos</option>
            <option value="60">60 segundos</option>
          </select>
        </div>
        <button id="refresh-now" type="button">Atualizar agora</button>
      </div>
      </div>
      <form id="filters" class="filters" method="get" th:action="${pagePath}" th:attr="hx-get=${pagePath}" hx-target="#dashboard" hx-swap="innerHTML" hx-trigger="submit, input changed delay:300ms from:input, change from:select" hx-sync="#dashboard:replace" hx-replace-url="true">
        <input id="page-number" type="hidden" name="page" th:value="${currentPage}">
        <input id="sort-column" type="hidden" name="sort" th:value="${sort}">
        <input id="sort-direction" type="hidden" name="direction" th:value="${direction}">
        <div class="search-filter"><label for="search">Pesquisar por nome</label><input id="search" type="search" name="q" th:value="${q}" placeholder="Digite o nome…" autocomplete="off"></div>
        <div><label for="ping-status">Status de ping</label><select id="ping-status" name="pingStatus">
            <option value="all" th:selected="${pingStatus == 'all'}">Todos os status</option>
            <optgroup label="Latência">
              <option value="latency-normal" th:selected="${pingStatus == 'latency-normal'}">Normal</option>
              <option value="latency-warning" th:selected="${pingStatus == 'latency-warning'}">Atenção</option>
              <option value="latency-critical" th:selected="${pingStatus == 'latency-critical'}">Crítica</option>
            </optgroup>
            <optgroup label="Perda de pacote">
              <option value="loss-normal" th:selected="${pingStatus == 'loss-normal'}">Normal</option>
              <option value="loss-warning" th:selected="${pingStatus == 'loss-warning'}">Atenção</option>
              <option value="loss-critical" th:selected="${pingStatus == 'loss-critical'}">Crítica</option>
            </optgroup>
          </select></div>
        <div th:if="${!groupPage}"><label for="host-group">Grupo de hosts</label>
          <select id="host-group" name="groupId">
            <option value="" th:selected="${groupId.isEmpty()}">Todos os grupos</option>
            <option th:if="${groupUnavailable}" th:value="${groupId}" selected>Grupo indisponível</option>
            <option th:each="group : ${groupOptions}" th:value="${group.id}" th:text="${group.name}" th:selected="${group.id == groupId}"></option>
          </select>
        </div>
      </form>
      <div class="legend"><span>● Normal</span><span>● Atenção</span><span>● Crítica</span></div>
      <section id="dashboard" th:attr="hx-get=${pagePath}" hx-include="#filters" hx-trigger="refresh" hx-swap="innerHTML" hx-sync="this:replace" aria-label="Resultados do monitoramento">
        <th:block th:replace="~{dashboard :: content}" />
      </section>
      <p id="connection" role="status"></p>
    </main>
    </div>

  </body>
</html>
