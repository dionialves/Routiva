services:
  app:
    environment:
      BACKUP_TFTP_HOST: ${BACKUP_TFTP_HOST:?Informe o IPv4 de gerência do servidor no .env}
      BACKUP_TFTP_INBOX: /mnt/tftp-inbox
    volumes:
      - type: bind
        source: ${BACKUP_TFTP_DIRECTORY:-/srv/traceone/tftp}
        target: /mnt/tftp-inbox
        bind:
          create_host_path: false

  tftp:
    build: ./deploy/tftp
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_BIND_SERVICE, SYS_CHROOT, SETGID, SETUID]
    command:
      - --foreground
      - --pidfile
      - /run/tftpd.pid
      - --ipv4
      - --address
      - "${BACKUP_TFTP_HOST}:69"
      - --port-range
      - "40000:40015"
      - --user
      - routiva
      - --secure
      - --create
      - --umask
      - "077"
      - --map-file
      - /etc/tftp-upload-only.rules
      - /srv/tftp
    volumes:
      - type: bind
        source: ${BACKUP_TFTP_DIRECTORY:-/srv/traceone/tftp}
        target: /srv/tftp
        bind:
          create_host_path: false
